<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whitepaper figure renderer</title>
    <style>
      :root {
        --bg: #1a1c22;
        --fg: #e7ecf2;
        --muted: #9aa6b2;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
      }
      #figure {
        display: inline-block;
        background: var(--bg);
        padding: 18px;
      }
      #figure .row {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      #figure .grid {
        display: grid;
        gap: 16px 18px;
      }
      figure.panel {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      figure.panel canvas {
        display: block;
        border-radius: 8px;
      }
      figure.panel figcaption {
        font-size: 14px;
        color: var(--fg);
        text-align: center;
        max-width: 420px;
        line-height: 1.35;
      }
      figure.panel figcaption .sub {
        color: var(--muted);
        font-size: 12.5px;
      }
      #missing {
        padding: 24px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="figure"></div>
    <script type="module" src="./figures.ts"></script>
  </body>
</html>
